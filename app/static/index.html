<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/styles.css">
<title>Lumi — The Lumen</title>
<style>
  html, body { height: 100%; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 680px; margin: 0 auto; }
  .app-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--glass-rim);
    background: rgba(255,255,255,0.5); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    position: sticky; top: 0; z-index: 10;
  }
  .chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .chat .empty { margin: auto; text-align: center; color: var(--muted); max-width: 360px; }
  .chat .empty .big { font-size: 46px; margin-bottom: 12px; }
  .engine { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--line-soft); }
  .engine .conf { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .controls {
    padding: 14px 18px; padding-bottom: max(16px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--glass-rim);
    display: flex; flex-direction: column; gap: 12px;
    background: rgba(255,255,255,0.55); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  .controls .switcher { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .controls .switcher .seg { white-space: nowrap; }
  .composer { display: flex; gap: 9px; align-items: center; }
  .composer input {
    flex: 1; background: rgba(255,255,255,0.6); border: 1px solid var(--glass-rim); color: var(--white);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 16px; padding: 13px 16px; font-size: 15px; font-family: var(--sans); outline: none;
  }
  .composer input::placeholder { color: var(--muted-2); }
  .composer input:focus { border-color: rgba(226,154,43,0.5); box-shadow: 0 0 0 3px var(--lime-dim); }
  .ptt-mini {
    width: 50px; height: 50px; min-width: 50px; border-radius: 50%; border: none;
    background: linear-gradient(180deg, #2b2f3a, #15171f); color: #fff;
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(20,22,30,0.32), inset 0 1px 0 rgba(255,255,255,0.14);
    transition: 0.15s; touch-action: none; user-select: none;
  }
  .ptt-mini.listening { animation: ring 1.3s ease-out infinite; }
  .reply-media { margin-top: 10px; }
  .thinking { align-self: flex-end; color: var(--muted); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
  <div class="app">
    <header class="app-top">
      <div class="brand">
        <span class="logo">lumi<b>.</b></span>
        <span class="tag">the lumen hotel</span>
      </div>
      <span class="chip" id="status"><span class="dot live"></span> ready</span>
    </header>

    <main class="chat" id="chat">
      <div class="empty" id="empty">
        <div class="big"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
        <p>Hi, I'm <b style="color:var(--lime)">Lumi</b>, your concierge at The Lumen Hotel.<br>
        Hold the mic and tell me how I can help — I'll hear how you're feeling and respond to it.</p>
        <p class="note" style="margin-top:12px;">(No microphone? You can type below.)</p>
      </div>
    </main>

    <div class="engine">
      <span class="chip" id="emotionChip">emotion: —</span>
      <span class="conf" id="srcNote"></span>
      <span id="opToggle" title="operator: force the emotion (fallback)"
            style="margin-left:auto; cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11px; color:var(--muted-2);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg> override</span>
    </div>

    <div class="controls">
      <div class="switcher" id="emoToggle" style="display:none;">
        <div class="seg active" data-e="auto">⟳ auto</div>
        <div class="seg" data-e="calm">calm</div>
        <div class="seg" data-e="anxious">anxious</div>
        <div class="seg" data-e="angry">angry</div>
        <div class="seg" data-e="happy">happy</div>
        <div class="seg" data-e="distress">distress</div>
      </div>
      <div class="composer">
        <input id="textIn" placeholder="type a message…" autocomplete="off" />
        <button class="btn primary" id="sendBtn">send</button>
        <button class="ptt-mini" id="ptt" title="hold to talk"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
